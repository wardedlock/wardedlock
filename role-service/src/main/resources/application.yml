spring:
  application:
    name: role-service
  config:
    import:
      - optional:file:.env
      - optional:file:../.env
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:?POSTGRES_HOST is required}:${POSTGRES_PORT:?POSTGRES_PORT is required}/${ROLE_DB:?ROLE_DB is required}
    username: ${ROLE_USER:?ROLE_USER is required}
    password: ${ROLE_PASSWORD:?ROLE_PASSWORD is required}
  flyway:
    enabled: false   # External Flyway runner handles migration; see ADR-0004

server:
  port: ${ROLE_SERVICE_PORT:?ROLE_SERVICE_PORT is required}
