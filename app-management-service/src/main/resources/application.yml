spring:
  application:
    name: app-management-service
  config:
    import:
      - optional:file:.env
      - optional:file:../.env
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${APP_MANAGEMENT_DB}
    username: ${APP_MANAGEMENT_USER}
    password: ${APP_MANAGEMENT_PASSWORD}
  flyway:
    enabled: false   # External Flyway runner handles migration; see ADR-0004

server:
  port: ${APP_MANAGEMENT_SERVICE_PORT}
